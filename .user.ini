; PHP-FPM per-directory settings (Hostinger / cPanel shared hosting)
; This file is read by PHP-FPM; .htaccess php_value lines are ignored in FPM mode.
; post_max_size MUST be larger than upload_max_filesize (covers 2 images at once)
upload_max_filesize = 8M
post_max_size       = 20M
max_execution_time  = 60
memory_limit        = 256M
